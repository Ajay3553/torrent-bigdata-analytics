name: torrent-bigdata-analytics

networks:
  bigdata-net:
    driver: bridge

services:
  # ==========================================
  # 1. STREAMING INGESTION (Zookeeper & Kafka)
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - bigdata-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - bigdata-net

  # ==========================================
  # 2. DISTRIBUTED STORAGE (Apache Hadoop HDFS)
  # ==========================================
  namenode:
    image: apache/hadoop:3.3.6
    container_name: namenode
    hostname: namenode
    command: >
      bash -c "if [ ! -d /tmp/hadoop-hadoop/dfs/name/current ]; then
                 hdfs namenode -format -D fs.defaultFS=hdfs://namenode:9000 -force;
               fi &&
               hdfs namenode -D fs.defaultFS=hdfs://namenode:9000"
    ports:
      - "9870:9870"
      - "9000:9000"
    networks:
      - bigdata-net

  datanode:
    image: apache/hadoop:3.3.6
    container_name: datanode
    hostname: datanode
    command: ["hdfs", "datanode", "-D", "fs.defaultFS=hdfs://namenode:9000"]
    depends_on:
      - namenode
    networks:
      - bigdata-net

  # ==========================================
  # 3. PROCESSING ENGINE (Apache Spark)
  # ==========================================
  spark-master:
    image: apache/spark:3.5.0
    container_name: spark-master
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    ports:
      - "8080:8080"
      - "7077:7077"
    networks:
      - bigdata-net

  spark-worker:
    image: apache/spark:3.5.0
    container_name: spark-worker
    depends_on:
      - spark-master
    entrypoint: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    networks:
      - bigdata-net